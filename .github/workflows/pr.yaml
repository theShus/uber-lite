name: pr
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read        # paths-filter lists the PR's files through the API
    uses: ./.github/workflows/changes.yaml

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pre-commit==4.7.0
      - name: pre-commit (validators with their own tools run in the chart and terraform jobs)
        env:
          SKIP: kubeconform,kube-linter,terraform_fmt,terraform_validate,terraform_tflint,terraform_trivy
        run: pre-commit run --all-files --show-diff-on-failure
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: hadolint
        run: |
          for f in apps/*/Dockerfile; do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:v2.15.1 < "$f"
          done

  test:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  images:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    uses: ./.github/workflows/build-image.yaml
    with:
      service: ${{ matrix.service }}

  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: bash tools/ci/install-k8s-tools.sh
      - run: bash tools/validate-chart.sh dev

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - run: terraform fmt -check -recursive infra/terraform
      - name: validate every layer
        run: |
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          for dir in infra/terraform/*/; do
            ls "$dir"*.tf >/dev/null 2>&1 || continue
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done
      - name: tflint
        working-directory: infra/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"
      - name: trivy config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_MISCONFIG_SCANNERS: terraform
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.76.0

  ci-ok:
    if: always()
    needs: [changes, lint, test, images, chart, terraform]
    runs-on: ubuntu-24.04
    steps:
      - name: every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")' >/dev/null
