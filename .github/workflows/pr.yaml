name: pr
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.services.outputs.list }}
      chart: ${{ steps.filter.outputs.chart }}
      terraform: ${{ steps.filter.outputs.terraform }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rider-api: ['apps/rider-api/**']
            driver-api: ['apps/driver-api/**']
            location-service: ['apps/location-service/**']
            matching-service: ['apps/matching-service/**']
            pricing-service: ['apps/pricing-service/**']
            trip-service: ['apps/trip-service/**']
            payment-service: ['apps/payment-service/**']
            notification-service: ['apps/notification-service/**']
            simulator: ['apps/simulator/**']
            ci: ['.github/**', 'tools/**']
            chart: ['charts/**', 'gitops/apps/**']
            terraform: ['infra/terraform/**']
      - id: services
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}   # JSON list of the filters that matched
          CI_CHANGED: ${{ steps.filter.outputs.ci }}
        run: |
          if [ "$CI_CHANGED" = "true" ]; then
            list=$(for d in apps/*/; do basename "$d"; done | jq -R . | jq -sc .)
          else
            list=$(echo "$CHANGED" | jq -c '[.[] | select(. != "ci" and . != "chart" and . != "terraform")]')
          fi
          echo "services: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pre-commit==4.7.0
      - name: pre-commit (validators with their own tools run in the chart and terraform jobs)
        env:
          SKIP: kubeconform,kube-linter,terraform_fmt,terraform_validate,terraform_tflint,terraform_trivy
        run: pre-commit run --all-files --show-diff-on-failure
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: hadolint
        run: |
          for f in apps/*/Dockerfile; do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:v2.15.1 < "$f"
          done

  test:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  images:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build (amd64, loaded locally, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.service }}
          load: true
          tags: ${{ matrix.service }}:pr
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.service }}:pr
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.76.0

  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: bash tools/ci/install-k8s-tools.sh
      - run: bash tools/validate-chart.sh dev

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - run: terraform fmt -check -recursive infra/terraform
      - name: validate every layer
        run: |
          # some layers read ~/.ssh/id_ed25519.pub (key pairs); CI only needs one to exist
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          for dir in infra/terraform/*/; do
            ls "$dir"*.tf >/dev/null 2>&1 || continue
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done
      - name: tflint
        working-directory: infra/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}   # tflint --init downloads the AWS ruleset from GitHub
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"
      - name: trivy config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Only Terraform: modules downloaded into .terraform/ ship example YAML we don't own.
          TRIVY_MISCONFIG_SCANNERS: terraform
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.76.0

  ci-ok:
    if: always()
    needs: [changes, lint, test, images, chart, terraform]
    runs-on: ubuntu-24.04
    steps:
      - name: every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")' >/dev/null
