name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency: # this is so a PR can be updated and re-run without waiting for the previous run to finish
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true # this means a new PR will cancel the previous run

jobs:
  changes:
    uses: ./.github/workflows/changes.yaml

  test:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0

        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q


  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0

        with:
          python-version: "3.13"
      - run: pip install pre-commit==4.7.0

      - name: pre-commit (validators with their own tools run in other jobs)
        env:
          SKIP: kubeconform,kube-linter
        run: pre-commit run --all-files --show-diff-on-failure

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: hadolint
        run: |
          for f in apps/*/Dockerfile; do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:v2.15.1 < "$f"
          done


  images:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    uses: ./.github/workflows/build-image.yaml
    with:
      service: ${{ matrix.service }}  # bez push: ostaje false, nema AWS-a


  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v5.0.1

        with:
          version: v4.3.0                                 # ista kao na hubu
      - run: bash tools/ci/install-k8s-tools.sh
      - run: bash tools/validate-chart.sh dev


  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1

        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: v0.64.0
      - run: terraform fmt -check -recursive infra/terraform

      - name: validate every layer
        run: |
          # some layers read ~/.ssh/id_ed25519.pub (key pairs); CI only needs one to exist
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          for dir in infra/terraform/*/; do
            ls "$dir"*.tf >/dev/null 2>&1 || continue
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done

      - name: tflint
        working-directory: infra/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}   # tflint --init downloads the AWS ruleset from GitHub
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"

      - name: trivy config
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_MISCONFIG_SCANNERS: terraform   # samo Terraform, ne YAML primere iz preuzetih modula
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.76.0


  ci-ok:
    if: always()
    needs: [changes, lint, test, images, chart, terraform]
    runs-on: ubuntu-24.04
    steps:
      - name: every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")' >/dev/null
