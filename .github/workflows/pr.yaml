name: pr

on:
  pull_request:
    branches: [main]

permission:
  contents: read


concurency: # this is so a PR can be updated and re-run without waiting for the previous run to finish
    group: pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true # this means a new PR will cancel the previous run

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:                                     # ono što drugi job-ovi čitaju kao needs.changes.outputs.X
      services: ${{ steps.services.outputs.list }}
      chart: ${{ steps.filter.outputs.chart }}
      terraform: ${{ steps.filter.outputs.terraform }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7.0.1

      - id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            rider-api: ['apps/rider-api/**']
            driver-api: ['apps/driver-api/**']
            location-service: ['apps/location-service/**']
            matching-service: ['apps/matching-service/**']
            pricing-service: ['apps/pricing-service/**']
            trip-service: ['apps/trip-service/**']
            payment-service: ['apps/payment-service/**']
            notification-service: ['apps/notification-service/**']
            simulator: ['apps/simulator/**']
            ci: ['.github/**', 'tools/**']
            chart: ['charts/**', 'gitops/apps/**']
            terraform: ['infra/terraform/**']

      - id: services
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}   # JSON lista filtera koji su se poklopili
          CI_CHANGED: ${{ steps.filter.outputs.ci }}
        run: |
          if [ "$CI_CHANGED" = "true" ]; then
            list=$(for d in apps/*/; do basename "$d"; done | jq -R . | jq -sc .)
          else
            list=$(echo "$CHANGED" | jq -c '[.[] | select(. != "ci" and . != "chart" and . != "terraform")]')
          fi
          echo "services: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"


  test:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0

        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q


  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0

        with:
          python-version: "3.13"
      - run: pip install pre-commit==4.7.0

      - name: pre-commit (validators with their own tools run in other jobs)
        env:
          SKIP: kubeconform,kube-linter
        run: pre-commit run --all-files --show-diff-on-failure

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: hadolint
        run: |
          for f in apps/*/Dockerfile; do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:v2.15.1 < "$f"
          done


  images:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1

      - name: build (amd64, loaded locally, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.service }}
          load: true
          tags: ${{ matrix.service }}:pr
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.service }}:pr
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.76.0


  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v5.0.1

        with:
          version: v4.3.0                                 # ista kao na hubu
      - run: bash tools/ci/install-k8s-tools.sh
      - run: bash tools/validate-chart.sh dev


  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1

        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: v0.64.0
      - run: terraform fmt -check -recursive infra/terraform

      - name: validate every layer
        run: |
          # some layers read ~/.ssh/id_ed25519.pub (key pairs); CI only needs one to exist
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          for dir in infra/terraform/*/; do
            ls "$dir"*.tf >/dev/null 2>&1 || continue
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done

      - name: tflint
        working-directory: infra/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}   # tflint --init downloads the AWS ruleset from GitHub
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"

      - name: trivy config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_MISCONFIG_SCANNERS: terraform   # samo Terraform, ne YAML primere iz preuzetih modula
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.76.0


  ci-ok:
    if: always()
    needs: [changes, lint, test, images, chart, terraform]
    runs-on: ubuntu-24.04
    steps:
      - name: every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")' >/dev/null
