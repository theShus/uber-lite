{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "microservice.name" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "microservice.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.metrics.serviceMonitor.enabled }}
    {{- with .Values.metrics.scrapeFrom }}
    - from:                          # Prometheus, scraping for the ServiceMonitor (19.2)
        - {{- include "microservice.peer" . | trim | nindent 10 }}
      ports:
        - port: http                 # the pod's named container port (8080), after the Service's DNAT
          protocol: TCP
    {{- end }}
    {{- end }}
    {{- range .Values.networkPolicy.allowFrom }}
    - from:
        - {{- include "microservice.peer" . | trim | nindent 10 }}
      ports:
        - port: {{ .port }}
          protocol: TCP
    {{- end }}
  egress:
    {{- range concat .Values.networkPolicy.allowTo .Values.networkPolicy.extraAllowTo }}
    - to:
        - {{- include "microservice.peer" . | trim | nindent 10 }}
      ports:
        - port: {{ .port }}
          protocol: TCP
    {{- end }}
{{- end }}
