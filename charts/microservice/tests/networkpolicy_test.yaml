suite: networkpolicy
templates:
  - networkpolicy.yaml
set:
  image.repository: example/app
tests:
  - it: lets only Prometheus in by default, on the http port
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1
      - lengthEqual:                          # one peer = namespace AND pod selector, not "anything in monitoring"
          path: spec.ingress[0].from
          count: 1
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: monitoring
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: prometheus
      - equal:
          path: spec.ingress[0].ports[0].port
          value: http

  - it: denies all ingress when metrics are off and nobody is allowed in
    set:
      metrics.serviceMonitor.enabled: false
    asserts:
      - isNullOrEmpty:
          path: spec.ingress

  - it: keeps the scrape rule first, before allowFrom
    set:
      networkPolicy.allowFrom:
        - {namespace: kong, podName: kong-gateway, port: 8080}
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 2
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: monitoring
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kong

  - it: puts namespace and pod selectors in ONE element (AND), not two (OR)
    set:
      networkPolicy.allowTo:
        - {namespace: data, podLabels: {strimzi.io/cluster: kafka}, port: 9092}
    asserts:
      - lengthEqual:
          path: spec.egress[0].to
          count: 1
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: data
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["strimzi.io/cluster"]
          value: kafka

  - it: renders a CIDR peer as an ipBlock
    set:
      networkPolicy.allowTo:
        - {cidr: 10.0.200.0/24, port: 5432}
    asserts:
      - equal:
          path: spec.egress[0].to[0].ipBlock.cidr
          value: 10.0.200.0/24

  - it: renders nothing when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: appends extraAllowTo after allowTo (a per-env peer without repeating the list)
    set:
      networkPolicy.allowTo:
        - {namespace: data, podLabels: {strimzi.io/cluster: kafka}, port: 9092}
      networkPolicy.extraAllowTo:
        - {cidr: 10.0.200.0/23, port: 5432}
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 2
      - equal:
          path: spec.egress[1].to[0].ipBlock.cidr
          value: 10.0.200.0/23
      - equal:
          path: spec.egress[1].ports[0].port
          value: 5432

  - it: renders only allowTo when extraAllowTo is empty
    set:
      networkPolicy.allowTo:
        - {namespace: data, podLabels: {strimzi.io/cluster: kafka}, port: 9092}
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 1
