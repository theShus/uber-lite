suite: route
templates:
  - httproute.yaml
  - grpcroute.yaml
set:
  image.repository: example/app
tests:
  - it: renders no route unless enabled
    asserts:
      - hasDocuments:
          count: 0

  - it: attaches an HTTPRoute to the platform's Gateway listener
    template: httproute.yaml
    set:
      route.enabled: true
      route.hostnames: [api.dev.example.com]
      route.pathPrefixes: [/rides]
    asserts:
      - equal:
          path: spec.parentRefs[0]
          value: {name: uber-lite, namespace: kong, sectionName: https}
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /rides
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 80
      - equal:
          path: metadata.annotations["konghq.com/protocols"]
          value: https


  - it: sends a GRPCRoute to the grpc port
    template: grpcroute.yaml
    set:
      route.enabled: true
      route.kind: GRPCRoute
      ports.grpc: 50051
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 50051

  - it: refuses a GRPCRoute for a service without a grpc port
    template: grpcroute.yaml
    set:
      route.enabled: true
      route.kind: GRPCRoute
    asserts:
      - failedTemplate:
          errorMessage: route.kind GRPCRoute needs ports.grpc
