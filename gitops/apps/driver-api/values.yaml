image:
  repository: driver-api

env:
  LOG_LEVEL: INFO

networkPolicy:
  allowFrom:
    - {podName: simulator, port: http}
    - {namespace: kong, port: http}
  allowTo:
    - {namespace: data, podLabels: {strimzi.io/cluster: kafka}, port: 9092}

route:
  annotations:
    konghq.com/protocols: https
    konghq.com/https-redirect-status-code: "301"
