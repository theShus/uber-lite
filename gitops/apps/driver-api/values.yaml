image:
  repository: driver-api

env:
  LOG_LEVEL: INFO
  KAFKA_BOOTSTRAP: kafka-kafka-bootstrap.data:9092

networkPolicy:
  allowFrom:
    - {podName: simulator, port: http}
    - {namespace: kong, port: http}
  allowTo:
    - {namespace: data, podLabels: {strimzi.io/cluster: kafka}, port: 9092}

route:
  enabled: true
  pathPrefixes: ["/drivers"]
  annotations:
    konghq.com/plugins: rl-drivers # connecting the RL pluging to the route
