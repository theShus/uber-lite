image:
  repository: payment-service
env:
  LOG_LEVEL: INFO
  PSP_FAILURE_RATE: "0.02"
  PSP_LATENCY_MS: "150"
secretEnv:
  DATABASE_URL: {secretName: payment-service-db, key: url}
migration:
  enabled: true
networkPolicy:
  allowTo:
    - {namespace: data, podLabels: {strimzi.io/cluster: kafka}, port: 9092}
    - {namespace: data, podLabels: {cnpg.io/cluster: postgres}, port: 5432}
