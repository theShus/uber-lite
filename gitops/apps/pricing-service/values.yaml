image:
  repository: pricing-service

ports:
  grpc: 50051

env:
  LOG_LEVEL: INFO
  VALKEY_URL: redis://valkey.data:6379/0

resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {memory: 96Mi}

service:
  annotations:
    konghq.com/protocol: grpc
  headless: true

networkPolicy:
  allowFrom:
    - {podName: rider-api, port: grpc}
    - {namespace: kong, port: grpc}
  allowTo:
    - {namespace: data, podName: valkey, port: 6379}

route:
  enabled: true
  kind: GRPCRoute
  gateway:
    sectionName: https
