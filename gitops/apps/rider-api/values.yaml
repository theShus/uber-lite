image:
  repository: rider-api

env:
  LOG_LEVEL: INFO
  PRICING_ADDR: pricing-service:50051
  KAFKA_BOOTSTRAP: kafka-kafka-bootstrap.data:9092 # this is used to figure out where the rest of kafka cluster is
                                                    # this url is ClusterIP made by strimzi
secretEnv:
  DATABASE_URL: {secretName: rider-api-db, key: url}

migration:
  enabled: true

networkPolicy:
  allowFrom:
    - {podName: simulator, port: http}
    - {namespace: kong, port: http} # opened traffic from the outside (kong proxy pods)
  allowTo:
    - {podName: pricing-service, port: 50051}
    - {namespace: data, podLabels: {strimzi.io/cluster: kafka}, port: 9092}     # Kafka brokers (Strimzi's own label)
    - {namespace: data, podLabels: {cnpg.io/cluster: postgres}, port: 5432}     # all Postgres instances (CNPG's own label)

route:
  enabled: true
  pathPrefixes: ["/rides"]
  annotations:
    konghq.com/plugins: key-auth-riders

