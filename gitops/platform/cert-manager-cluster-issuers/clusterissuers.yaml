apiVersion: cert-manager.io/v1
kind: ClusterIssuer # sluster issuer can take pod identity, and we are not messing with NS specific issuers
metadata:
  name: letsencrypt-staging
  labels: {app.kubernetes.io/part-of: uber-lite-platform}
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: luka.jeremic.social@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account     # the ACME account's key (cert-manager creates it)
    solvers:
      - selector:
          dnsZones: ["aws.shus.world"]
        dns01:
          route53:
            region: eu-central-1
            hostedZoneID: Z09518931DCYGVVI5WZZO         # terraform -chdir=infra/terraform/dns output -raw zone_id
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels: {app.kubernetes.io/part-of: uber-lite-platform}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: luka.jeremic.social@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - selector:
          dnsZones: ["aws.shus.world"]
        dns01:
          route53:
            region: eu-central-1
            hostedZoneID: Z09518931DCYGVVI5WZZO
