apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: uber-lite
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: cloudflared}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/part-of: uber-lite
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: cloudflared}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: cloudflared-token, key: token} # gotten from the terraform output and put into secret
          ports:
            - {name: metrics, containerPort: 2000}
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: cloudflared
  labels: {app.kubernetes.io/name: cloudflared, app.kubernetes.io/part-of: uber-lite}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cloudflared}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared
  namespace: cloudflared
  labels: {app.kubernetes.io/name: cloudflared, app.kubernetes.io/part-of: uber-lite}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: cloudflared}
  policyTypes: [Ingress, Egress]
  egress:
    - ports:                                  # the tunnel to Cloudflare's edge
        - {protocol: TCP, port: 7844}
        - {protocol: UDP, port: 7844}
    - to:                                     # Kong's proxy pods (the Service's 443 → 8443)
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kong}
          podSelector:
            matchLabels: {app.kubernetes.io/name: gateway}
      ports:
        - {protocol: TCP, port: 8443}

    # Argo CD's UI, through the argocd.<domain> tunnel rule (18.7). Its own rule, because the port differs:
    # a NetworkPolicy sees the POD's port, after the Service's DNAT (80 → 8080), not the Service's 80.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: argocd}
          podSelector:
            matchLabels: {app.kubernetes.io/name: argocd-server}
      ports:
        - {protocol: TCP, port: 8080}

      # Grafana's UI, through the grafana.<domain> tunnel rule (19.2). Pod port 3000, after the Service's DNAT.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: grafana}
      ports:
        - {protocol: TCP, port: 3000}

    # KubeView's UI, through the kubeview.<domain> tunnel rule. Service and pod port are both 8000.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kubeview}
          podSelector:
            matchLabels: {app.kubernetes.io/name: kubeview}
      ports:
        - {protocol: TCP, port: 8000}

    # Access token check (18.7): with origin_request.access, cloudflared verifies each request's
    # Cf-Access-Jwt-Assertion against Access's public keys, fetched from
    # https://<team>.cloudflareaccess.com/cdn-cgi/access/certs over the internet (through the NAT).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8            # not the VPC: in-cluster targets keep their own rules above
              - 169.254.169.254/32    # not the instance metadata service
      ports:
        - {protocol: TCP, port: 443}
