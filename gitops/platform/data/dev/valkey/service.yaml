apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: uber-lite
spec:
  clusterIP: None                                # headless: DNS answers with the pod's own IP
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - {name: valkey, port: 6379, targetPort: valkey}
