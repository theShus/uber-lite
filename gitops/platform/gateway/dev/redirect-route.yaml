# route that redirects all HTTP traffic to HTTPS
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-to-https
  namespace: kong # this is a platform route, so it should live in platform kong namespace, not in the uber-lite namespace (its for apps)
spec:
  parentRefs: 
  - name: uber-lite
    sectionName: http
  hostnames: ["*.dev.shus.world"]
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301