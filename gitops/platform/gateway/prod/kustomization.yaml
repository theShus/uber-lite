apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - partner-key.yaml

# replace host names for env

# add annotations for cert manager, it takes the name of the cert issuer from the annotations and finds it
# then it requests a cert from the ClusterIssuer we declared in gitops\platform\cert-manager

patches:
  - target:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: uber-lite
    patch: |-
      - op: replace
        path: /spec/listeners/0/hostname
        value: "*.aws.shus.world"
      - op: replace
        path: /spec/listeners/1/hostname
        value: "*.aws.shus.world"
      - op: replace
        path: /spec/listeners/1/tls/certificateRefs/0/name
        value: "aws-wildcard-tls"
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          cert-manager.io/private-key-algorithm: ECDSA
