apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - argo-servicemonitor.yaml
  - red-rules.yaml
configMapGenerator:
  - name: dashboard-uber-lite-red
    namespace: monitoring
    files:
      - dashboards/uber-lite-red.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
  - name: dashboard-argocd-fleet
    namespace: monitoring
    files:
      - dashboards/argocd-fleet.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
