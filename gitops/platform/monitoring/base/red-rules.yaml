apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: uber-lite-red
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: uber-lite
spec:
  groups:
    - name: uber-lite-red
      rules:
        - record: job:http_requests:rate5m
          expr: sum by (namespace, job, team) (rate(http_requests_total[5m]))

        - record: job:http_request_errors:rate5m
          expr: |
            sum by (namespace, job, team) (rate(http_requests_total{status=~"5.."}[5m]))
            or sum by (namespace, job, team) (rate(http_requests_total[5m])) * 0

        - record: job:http_request_errors:ratio_rate5m
          expr: job:http_request_errors:rate5m / job:http_requests:rate5m

        - record: job:http_request_duration_seconds:p50
          expr: histogram_quantile(0.50, sum by (namespace, job, team, le) (rate(http_request_duration_seconds_bucket[5m])))

        - record: job:http_request_duration_seconds:p95
          expr: histogram_quantile(0.95, sum by (namespace, job, team, le) (rate(http_request_duration_seconds_bucket[5m])))

        - record: job:http_request_duration_seconds:p99
          expr: histogram_quantile(0.99, sum by (namespace, job, team, le) (rate(http_request_duration_seconds_bucket[5m])))

        - record: job_route:http_requests:rate5m
          expr: sum by (namespace, job, team, route) (rate(http_requests_total[5m]))
