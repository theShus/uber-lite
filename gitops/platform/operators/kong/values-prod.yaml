# Kong behind an LBC-managed NLB (16.3)
gateway:
  autoscaling: # HPA for kong proxy pods
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    metrics:
      - type: Resource
        resource:
          name: cpu
          target: {type: Utilization, averageUtilization: 70}
  podDisruptionBudget:          # a node drain never takes both proxies at once
    enabled: true
    maxUnavailable: 1
  resources:                    # the HPA computes % of the CPU *request*: no request, no HPA
    requests: {cpu: 200m, memory: 256Mi}
    limits: {memory: 512Mi}
  proxy:
    type: LoadBalancer
    loadBalancerClass: service.k8s.aws/nlb      # explicit owner: LBC, not the in-tree cloud controller
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing # allows public internet
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip # send directly to pod ips, not instance through NodePort
      service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true,deregistration_delay.timeout_seconds=30
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: http
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "8100"
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /status/ready
