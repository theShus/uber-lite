apiVersion: external-secrets.io/v1 # parameter store cf token value
kind: ExternalSecret # its a secret so CF pods can load it after terra has finished
metadata:
  name: cloudflared-token
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: cloudflared-token
    creationPolicy: Owner
  data:
    - secretKey: token            # ključ u k8s Secret-u (cloudflared čita "token")
      remoteRef:
        key: cloudflared/token    # + prefix iz store-a = /uber-lite/prod/cloudflared/token
