apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rides-db
  namespace: uber-lite
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-apps
    kind: ClusterSecretStore
  target:
    name: rider-api-db # ime K8s Secreta koje montira rider-api Deployment
    creationPolicy: Owner
    template:
      data:
        url: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require"
  dataFrom:
    - extract:
        key: db/rides
---
