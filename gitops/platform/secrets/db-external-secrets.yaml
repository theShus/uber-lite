apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-master
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-rds-master
    kind: ClusterSecretStore
  target:
    name: rds-master-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: master-secret-arn-placeholder # vrednost iz master_secret_arn (terraform -chdir=infra/terraform/data output -raw master_secret_arn)
