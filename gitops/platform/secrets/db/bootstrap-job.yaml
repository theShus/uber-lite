apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap
  namespace: data
  labels:
    app.kubernetes.io/name: db-bootstrap
    app.kubernetes.io/part-of: uber-lite
  annotations:  # these annotations are so ArgoCD knows when to run the job, instead of us starting the job through .sh in makefile
    argocd.argoproj.io/hook: PostSync # post sync means after you sync this folder, only then start this job, aka after the externalsecrets.yaml is synced
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: db-bootstrap, app.kubernetes.io/part-of: uber-lite}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # postgres user in the alpine image
        runAsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: psql
          image: postgres:18.7-alpine3.24
          command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/sql/db-bootstrap.sql"]
          env:
            - {name: PGHOST, valueFrom: {secretKeyRef: {name: db-users, key: host}}}
            - {name: PGDATABASE, value: postgres}
            - {name: PGSSLMODE, value: require}
            - {name: PGCONNECT_TIMEOUT, value: "10"}
            - {name: PGUSER, valueFrom: {secretKeyRef: {name: rds-master-secret, key: username}}}
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: rds-master-secret, key: password}}}
            - {name: RIDES_PW, valueFrom: {secretKeyRef: {name: db-users, key: rides}}}
            - {name: TRIPS_PW, valueFrom: {secretKeyRef: {name: db-users, key: trips}}}
            - {name: PAYMENTS_PW, valueFrom: {secretKeyRef: {name: db-users, key: payments}}}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: sql, mountPath: /sql, readOnly: true}
      volumes:
        - name: sql
          configMap: {name: db-bootstrap-sql}   # kustomize appends a content hash and rewrites this
