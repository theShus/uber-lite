# we will use these 3 secrets as a quick access URL for our 3 service pods to use, and then another secret for the raw pass value for the RDS SQL inputs

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rides-db
  namespace: uber-lite
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-apps
    kind: ClusterSecretStore
  target:
    name: rider-api-db # ime K8s Secreta koje montira rider-api Deployment
    creationPolicy: Owner
    template:
      data: # from the secret var keys we construct the DB connect url straight up instead of giving the vars directly
        url: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require"
  dataFrom:
    - extract:
        key: db/rides
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trips-db
  namespace: uber-lite
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-apps
    kind: ClusterSecretStore
  target:
    name: trip-service-db # za trip-service
    creationPolicy: Owner
    template:
      data:
        url: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require"
  dataFrom:
    - extract:
        key: db/trips
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payments-db
  namespace: uber-lite
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-apps
    kind: ClusterSecretStore
  target:
    name: payment-service-db # za payment-service
    creationPolicy: Owner
    template:
      data:
        url: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require"
  dataFrom:
    - extract:
        key: db/payments
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-master
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-rds-master
    kind: ClusterSecretStore
  target:
    name: rds-master-secret
    creationPolicy: Owner
  dataFrom: # data from is take the WHOLE VALUE FROM SECRET
    - extract:
        key: master-secret-arn-placeholder # VALUE FROM MASTER SECRET ARN ! (terraform -chdir=infra/terraform/data output -raw master_secret_arn)
---
# this secret will pull into the Data NS (that why we need secret store to allow data as well) and create a secret with all pass values for new RDS users
# instead of creating 3 new ones we pull values from 3 MS external secrets into this one
# we will then use this Secret in the db bootstrap job to create 3 users for our 3 services.

# WHY is this needed? because only data NS can view our Master user, so we need data Secrets with pass values,
# and our other secrets are just URLs for convenience, so this one is just pure passwords

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-users
  namespace: data
  labels:
    app.kubernetes.io/name: db-bootstrap
    app.kubernetes.io/part-of: uber-lite
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-apps
  data: # data is TAKE ONLY ONE VAR VALUE
    - {secretKey: host, remoteRef: {key: db/rides, property: host}}
    - {secretKey: rides, remoteRef: {key: db/rides, property: password}}
    - {secretKey: trips, remoteRef: {key: db/trips, property: password}}
    - {secretKey: payments, remoteRef: {key: db/payments, property: password}}
