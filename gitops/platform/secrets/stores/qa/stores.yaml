# ClusterSecretStore - its less a bridge and more of an approval that allows that NS/obj to request from the ESO to make a secret there.
# Pods cant mount/use secrets in a diff NS, so uber-lite pods CAN'T use Secrets from Data NS.
# so we have to allow uber-lite NS to request ExternalSecrets from SEO, and then pods in there can use them.

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-apps
  labels:
    app.kubernetes.io/part-of: uber-lite
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      prefix: uber-lite/qa/     # ExternalSecret traži "db/rides", a ESO čita uber-lite/qa/db/rides
  conditions:
    - namespaces:
        - uber-lite
        - data
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-rds-master
  labels:
    app.kubernetes.io/part-of: uber-lite
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
  conditions:
    - namespaces:
        - data # samo namespace gde se izvršava db-bootstrap Job
