# One-off check of the whole chain: Pod Identity -> IAM -> Secrets Manager -> k8s Secret.
# Applied by hand during the session, deleted right after. Nothing reads this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-test
  namespace: data
  labels: {app.kubernetes.io/part-of: uber-lite}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-apps
    kind: ClusterSecretStore
  target:
    name: eso-test
    creationPolicy: Owner      # deleting the ExternalSecret deletes this Secret too
  dataFrom:
    - extract:
        key: db/rides          # + prefix = uber-lite/prod/db/rides
